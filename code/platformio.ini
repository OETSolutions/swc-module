; PlatformIO Project Configuration File
;
; Framework is ESP-IDF, NOT Arduino. The field-reported crash class
; (WiFiClientSecure/mbedTLS X509 alloc failure, and an uncatchable std::bad_alloc
; inside ESPAsyncWebServer) is an Arduino-core defect; ESPAsyncWebServer does not
; exist in IDF, and the mbedTLS GCM/HARDWARE_AES path that fails is the one we
; explicitly disable below. Do not "simplify" this back to framework = arduino.

[platformio]
default_envs = esp32s3
; PlatformIO has exactly ONE global test_dir, and it is NOT a per-env option --
; `test_dir` inside an [env:*] section is silently ignored (verified against
; PlatformIO 6.2.0, project/options.py). So both trees live under one root:
; test/ for the device suites (Unity) and test_native/ for the host suites
; (GoogleTest), each env ignoring the other.
;
; Suite names are PATHS RELATIVE TO test_dir and are matched with fnmatch, so a
; suite is ignored only if its whole relative path matches a pattern. That is
; why each env needs BOTH forms: `test_native` (the tree directory itself,
; which PlatformIO also collects as a suite) and `test_native/*` (the suites
; inside it).
;
; test_dir must be the project root, because test_native/ sits beside test/.
; The root is also where PlatformIO puts its own build output
; (.pio/build/<env>/test/...), and the walker cannot tell that from a real
; suite -- it collects it and copies the trees into it again, so the suite list
; grows on every run. Hence the `.pio/*` ignores, which are load-bearing.
test_dir = .

[env]
board_build.partitions = partitions.csv
; The maintenance page is compiled into flash (spec 9.2 has no filesystem
; partition), so the generator runs before a device build.
extra_scripts = extra_assets.py
board_build.flash_mode = qio
board_build.flash_size = 4MB
build_flags =
    -Wall
    -Wextra
    -Werror
    -D SWC_FW_VERSION_RAW=\"${sysenv.SWC_FW_VERSION}\"
    -D SWC_GIT_SHA_RAW=\"${sysenv.SWC_GIT_SHA}\"
check_skip_packages = yes

[env:esp32s3]
; pioarduino fork pinned to an exact release tag. Stock PlatformIO's
; espressif32 7.1.3 only publishes framework-espidf up to 4.60100.0 (IDF 4.6.1),
; which predates the mbedTLS bugfix this project depends on. Pinning the tag (not
; the rolling "stable" zip) also avoids pioarduino's reinstall path, which
; crashes under Python 3.14 (exists(None) in safe_framework_cleanup). This
; machine runs Python 3.14.7.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = swc-s3
framework = espidf
board_build.flash_size = 4MB
test_framework = unity
test_ignore =
    test_native
    test_native/*
    .pio/*
    ; Managed IDF components bring their OWN test_apps/ directories, which
    ; PlatformIO collects as suites and then fails to build. They are not
    ; ours and are never run.
    managed_components/*
monitor_speed = 115200

[env:native]
; Host tests: pure logic only, no ESP32 toolchain involved. GoogleTest.
;
; `test/*` must be ignored: those suites are Unity, built for the device, and
; GoogleTest cannot link them on the host.
platform = native
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -I lib
    -I test_native
    -D SWC_NATIVE_TEST
test_framework = googletest
; `test/*` must be ignored: those suites are Unity, built for the device, and
; GoogleTest cannot link them on the host.
;
; `test_native` (bare, no `/*`) must ALSO be ignored, for the reason in the
; test_dir comment above: PlatformIO collects the tree directory itself as a
; suite, and building it compiles EVERY test_main.cpp underneath it -- which is
; two definitions of `_main`:
;   duplicate symbol '_main' in: test_analog/test_main.o, test_hal/test_main.o
; Note it is NOT `test_native/*`: that would also hide the real suites, which
; are exactly the ones this env must run. With only one suite present the bug
; was invisible (the bare tree built one _main and merely re-ran that suite),
; so it only surfaced once Task 3 added a second one.
test_ignore =
    test
    test/*
    test_native
    .pio/*
    ; Managed IDF components bring their OWN test_apps/ directories, which
    ; PlatformIO collects as suites and then fails to build. They are not
    ; ours and are never run.
    managed_components/*
; test_build_src compiles the test suites, but it does NOT compile the sources
; they link against: `-<*>` excludes the project src/ tree (correct: this is a
; host build, and src/ is ESP-IDF device code). Two `+` lines put the host-
; compilable sources back -- test_native/*.cpp (MockHAL.cpp, which lives beside
; the suites) and lib/*/*.cpp (the pure-logic modules under test). Without them
; the link fails with undefined symbols:
;   ld: symbol(s) not found for architecture arm64
; LDF does not cover this: it scans src_dir, which `-<*>` has emptied, so the
; library directory is never detected as a dependency.
build_src_filter =
    -<*>
    +<../test_native/*.cpp>
    +<../lib/*/*.cpp>
    ; EspHal is the ONE lib/ file the host cannot compile: it is the only one
    ; that includes ESP-IDF driver headers (driver/gpio.h, esp_adc/*.h, nvs.h),
    ; which do not exist for the native target. Excluding it is correct rather
    ; than a workaround -- it is deliberately the one part of the firmware not
    ; host-testable, and it is covered by the on-device Unity suite instead
    ; (test/test_hw). Every other lib/ file runs on the host.
    ;
    ; NOTE: this exclusion must be revisited whenever a lib/ file starts
    ; including an IDF header. The failure is a hard compile error, so it cannot
    ; pass silently -- but it looks like a broken host build rather than a
    ; missing exclusion.
    -<../lib/HAL/EspHal.cpp>
    ; UsbLink is the SECOND such file, and the only other one: it is the single
    ; translation unit that names TinyUSB (tinyusb.h, tusb_cdc_acm.h) and
    ; esp_log.h. Everything host-testable about the link lives in UsbCdc, whose
    ; raw write is INJECTED precisely so the buffering logic can be tested
    ; without any of this. This file is thin by design and its coverage is
    ; test/test_hw/TestUsbCdc.cpp.
    -<../lib/Link/UsbLink.cpp>
test_build_src = yes
lib_deps =
    google/googletest@^1.15.2
    ; The same parser the device uses, pinned to the same version on both sides.
    ; Git-pinned rather than registry: the PlatformIO registry's newest cJSON is
    ; 1.7.18 (third-party republish), while IDF 5.5.5 bundles 1.7.19 -- and
    ; 1.7.19 is the one that adds CJSON_NESTING_LIMIT and the circular-reference
    ; limit, i.e. the stack-overflow guards on parsing untrusted JSON. A host
    ; gate running a weaker parser than the device is a gate that cannot fail.
    https://github.com/DaveGamble/cJSON.git#v1.7.19
