; PlatformIO project — SWC RIG DRIVER board.
;
; This is the firmware for the board that DRIVES the device under test (DUT). It
; is not the product firmware (`../code`) and it is not the bring-up tool
; (`../code_board_test`). It shares no build with either; the hardware facts it
; needs (pin map, DAC frame, servo transfer function) are COPIED from
; code_board_test, which in turn cross-checked them against production/netlist.ipc.
;
; WHY THIS EXISTS. The DUT firmware decides what to do from the voltage on its
; ladder input and from the level on its AUX1 input. To exercise that end to end
; with no vehicle and no steering-wheel pod, a second SWC board is wired to
; PRESENT those voltages: its KEY servo output sinks the DUT's ladder input (a
; press pulls the node down), and its AUX1 pin sinks the DUT's AUX1 (the
; programming switch). Both boards are the same hardware, so this project's pin
; map is identical to the bring-up tool's.
;
; WHY ARDUINO, like the bring-up tool: this is a bench instrument. It needs a
; serial console and no ceremony, and it never ships. The analog work still goes
; through the ESP-IDF adc_oneshot/adc_cali path (src/Adc.cpp), not analogRead().

[platformio]
default_envs = swc-s3-driver
; Host tests for the pure logic (the gesture timeline geometry). They run on the
; development machine with no board attached.
test_dir = .

[env:swc-s3-driver]
; See code_board_test/platformio.ini for the full reasoning on `strict` and on
; the ARDUINO_USB_MODE choice. Both are load-bearing:
;   strict          a library for another architecture must not enter this build.
;   USB_MODE=1      `Serial` is the ROM USB-Serial-JTAG peripheral, which
;                   enumerates before setup() and survives a crashed app -- so a
;                   bad flash never needs the recessed BOOT button to recover.
lib_compat_mode = strict
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = swc-s3-test
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Bench tool: no OTA, so one large app slot with room to spare.
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 4MB

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
    -I include
    -I lib

; lib/swc_logic is compiled EXPLICITLY rather than left to the library
; dependency finder. Here LDF resolves only the framework libraries and never
; the project's own, so the pure-logic sources would be absent from the image and
; the link would fail with undefined references to Output:: -- while the host
; build (which lists the same files below) links them fine. Naming them here
; makes the device build compile them the same way. The `+<*>` half is the
; default src/ filter; the second line is what adds the lib.
build_src_filter =
    +<*>
    +<../lib/*/*.cpp>

; ---------------------------------------------------------------------------
; Host tests: pure logic only, no toolchain, no board.
;
; PlatformIO has exactly ONE global test_dir, so both trees live under it and
; each env ignores the other. Test suite names are paths relative to test_dir
; matched with fnmatch: `test_host` (the tree itself, which PlatformIO also
; collects) and `test_host/*` are both needed -- the same trap the production
; project's platformio.ini documents, whose failure is a duplicate _main.
; ---------------------------------------------------------------------------
[env:host]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
    -I lib
test_ignore =
    test_host
    .pio/*
test_build_src = yes
build_src_filter =
    -<*>
    +<../lib/*/*.cpp>
