; PlatformIO project — SWC adapter bring-up / hardware test firmware
;
; This is a SEPARATE project from ../swc_module_pcb/code. It does not replace the
; production firmware and shares no build with it. Where it duplicates a hardware
; fact (a pin, an address, a resistor ratio) that fact is copied from the DESIGN
; and the firmware spec and cross-checked against production/netlist.ipc, which is
; the only authority. See README.md for the provenance of every constant.
;
; Framework is ARDUINO, deliberately, and this is the one place it differs from
; the production build. The test tool is not the product: it needs a serial menu,
; a web page and a WiFi client with minimum ceremony, and it never ships. The
; analog measurements are NOT taken with Arduino's analogRead() -- they use the
; ESP-IDF adc_oneshot + adc_cali path directly, because the calibrated ceiling
; (2.9 V at 12 dB) and the eFuse curve-fitting fallback are load-bearing facts
; that Arduino's wrapper hides. See src/hal/Adc.cpp.

[platformio]
default_envs = swc-s3-test
; Host tests for the pure logic (frame encoding, gain policy, temperature math).
; They run on the development machine with no board attached.
test_dir = .

[env:swc-s3-test]
; STRICT compatibility, and it is load-bearing rather than a preference.
;
; This machine has a populated global library store at ~/.platformio/lib. PlatformIO's
; DEFAULT compatibility mode ("soft") does not exclude a library whose manifest
; declares a different platform -- it includes it and warns -- so an RP2040-only
; library (RPAsyncTCP) was being compiled for the ESP32-S3 here and failing on a
; missing Network.h. The failure looks like a broken project, not a global-config
; leak.
;
; "strict" makes the manifest's own `platforms` field authoritative, so a library
; for another architecture cannot enter this build. That is the correct rule for a
; project that must build the same way on any machine.
lib_compat_mode = strict
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = swc-s3-test
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; No OTA: this is a bench tool. The 4 MB part is spent on one large app slot so
; there is room for the web assets and the test strings without budgeting.
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 4MB

; Arduino's USB core has two mutually exclusive choices for the single internal
; PHY (spec 4.1), and this project takes the OTHER one from production:
;
;   ARDUINO_USB_MODE=1  ->  `Serial` is HWCDCSerial, the ROM USB-Serial-JTAG
;                           peripheral. It enumerates before setup() runs, it
;                           survives a crashed app, and it is the peripheral the
;                           ROM download mode uses -- so recovery from a bad
;                           build never needs the recessed BOOT button.
;
; That last property is the whole reason for the choice: a bring-up tool that
; can brick its own console is a tool you cannot use to debug the failure it
; exists to find. The TinyUSB/OTG path (what the product actually uses for the
; head-unit link) is exercised by test 24, which hands the PHY over on request
; and says so.
;
; ARDUINO_USB_CDC_ON_BOOT=1 makes Serial the CDC device rather than UART0.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
    -I include
    -I lib

; Credentials are NOT committed. tools/gen_secrets.py reads swc_module_pcb's
; code/.env (or a local .env, which wins) and writes include/Secrets.h before the
; build. The generated header is git-ignored; see .gitignore and README.md.
extra_scripts = pre:tools/gen_secrets.py

; ---------------------------------------------------------------------------
; Host tests: pure logic only, no toolchain, no board.
;
; PlatformIO has exactly ONE global test_dir, so both trees live under it and
; each env ignores the other. Suite names are paths relative to test_dir matched
; with fnmatch: `test_host` (the tree itself, which PlatformIO also collects as a
; suite) and `test_host/*` are both needed. Same trap production's platformio.ini
; documents at length; the failure it causes there is a duplicate _main.
; ---------------------------------------------------------------------------
[env:host]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
    -I lib
test_ignore =
    test_host
    .pio/*
; PlatformIO compiles test suites but NOT the sources they link against, so the
; pure-logic library must be put back explicitly. Its own build_src_filter empties
; src/, and LDF does not cover lib/ once src_dir is empty -- without these lines the
; link fails with undefined symbols for every Output:: and Temp:: function.
; test_build_src must be on for build_src_filter to be honoured by a test build at
; all -- without it the filter is ignored and nothing from lib/ is compiled.
test_build_src = yes
build_src_filter =
    -<*>
    +<../lib/*/*.cpp>
