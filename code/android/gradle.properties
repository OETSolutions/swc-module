# Gradle JVM settings for the SWC app.
#
# `org.gradle.java.home` is deliberately NOT set here: it is a machine-specific
# absolute path (JDK 17 on this machine, something else elsewhere), and committing
# it would break every other checkout. Use `JAVA_HOME` or `-Dorg.gradle.java.home`.

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
